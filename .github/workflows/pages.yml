name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          # The diagrams are self-contained pages, so the site is mostly a copy
          # of the asset directory. The landing page is separate because it
          # leads with the flow examples, and the upstream tabbed gallery keeps
          # its own URL rather than being replaced.
          mkdir -p _site/examples
          cp -R skills/diagram-design-fly/assets/. _site/
          mv _site/index.html _site/gallery.html
          cp docs/site/index.html _site/index.html
          cp docs/examples/*.html _site/examples/
          test -f _site/gallery.html
          test -f _site/example-skill-architecture-flow.html
          test -f _site/examples/opspilot-current-architecture.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
