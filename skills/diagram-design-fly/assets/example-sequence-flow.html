<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>API 调用时序 · Flow</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"><style>
*,*::before,*::after{box-sizing:border-box}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--rule:rgba(45,49,66,.12);--sans:'Geist','Noto Sans SC',sans-serif;--mono:'Geist Mono',monospace;--serif:'Instrument Serif','Noto Sans SC',serif;--flow-cycle:4.6s;--flow-ease:linear}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 24px;background:var(--paper);color:var(--ink);font-family:var(--sans)}[data-motion-root]{width:min(100%,1000px)}.eyebrow{margin:0 0 8px;color:var(--muted);font:500 12px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 18px;font:400 34px/1.15 var(--serif)}svg{display:block;width:100%;min-width:820px}.legend{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font:500 12px/1.5 var(--mono)}.flow-stream{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 9;pointer-events:none}[data-motion-mode="flow"] .flow-stream{animation:sequence-flow-stream var(--flow-cycle) var(--flow-ease) infinite;animation-delay:var(--flow-delay,0s)}@keyframes sequence-flow-stream{to{stroke-dashoffset:-70}}.flow-token{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;stroke-dasharray:0 1;stroke-dashoffset:1;pointer-events:none}[data-motion-mode="flow"] .flow-token{animation:sequence-flow-token var(--flow-cycle) var(--flow-ease) infinite;animation-delay:var(--flow-delay,0s)}@keyframes sequence-flow-token{to{stroke-dashoffset:0}}html[data-motion="static"] [data-motion-decorative]{display:none!important}html[data-motion="static"] *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){[data-motion-decorative]{display:none!important}}@media print{[data-motion-decorative]{display:none!important}*{animation:none!important}}.msg{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#sequence-flow-arrow)}.life{stroke:var(--soft);stroke-width:1;stroke-dasharray:4 5}.actor{fill:var(--paper);stroke:var(--ink);stroke-width:1}.name{font:600 13px var(--sans);text-anchor:middle}.sub{fill:var(--soft);font:9px var(--mono);text-anchor:middle}.label{fill:var(--soft);font:9px var(--mono);text-anchor:middle}
</style></head><body><main data-motion-root data-motion-mode="flow" data-flow-cycle="4.6" data-frame="static" data-static-frame="complete"><p class="eyebrow">Sequence · API request / response</p><h1>一次 API 调用时序</h1><svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-flow-title sequence-flow-desc"><title id="sequence-flow-title">API 调用时序</title><desc id="sequence-flow-desc">客户端发起请求，经认证服务校验后调用业务服务，业务服务把响应返回客户端。</desc><defs><marker id="sequence-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="980" height="560" fill="#f5f5f5"/>
<line class="life" x1="120" y1="116" x2="120" y2="390"/><line class="life" x1="340" y1="116" x2="340" y2="390"/><line class="life" x1="560" y1="116" x2="560" y2="390"/><line class="life" x1="820" y1="116" x2="820" y2="390"/><path class="msg" d="M120 160 H340"/><path class="msg" d="M340 224 H560"/><path class="msg" d="M560 288 H820"/><path class="msg" d="M820 352 H120" stroke-dasharray="5 4"/>
<rect class="actor" x="56" y="56" width="128" height="60" rx="6"/><rect class="actor" x="276" y="56" width="128" height="60" rx="6"/><rect class="actor" x="496" y="56" width="128" height="60" rx="6"/><rect class="actor" x="756" y="56" width="128" height="60" rx="6"/><text class="name" x="120" y="82">客户端 Client</text><text class="sub" x="120" y="102">caller</text><text class="name" x="340" y="82">认证 Auth</text><text class="sub" x="340" y="102">token check</text><text class="name" x="560" y="82">服务 Service</text><text class="sub" x="560" y="102">business API</text><text class="name" x="820" y="82">响应 Response</text><text class="sub" x="820" y="102">payload</text><text class="label" x="230" y="148">REQUEST</text><text class="label" x="450" y="212">VERIFY</text><text class="label" x="690" y="276">CALL</text><text class="label" x="470" y="340">200 OK</text><line x1="60" y1="438" x2="920" y2="438" stroke="#4f5d75" stroke-opacity=".14"/><text x="60" y="464" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="10" font-weight="600" letter-spacing="1.2">生成该图的指令 · PROMPT THAT MADE THIS</text><text x="60" y="488" fill="#4f5d75" font-family="'Noto Sans SC','Geist',sans-serif" font-size="12">中文：画一次 API 调用的时序，让请求从客户端经过认证和服务，再返回响应。</text><text x="60" y="512" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11">EN: Draw an API call sequence from client through auth and service to the response.</text><g data-motion-decorative aria-hidden="true" focusable="false"><path class="flow-stream" d="M120 160 H340"/><path class="flow-stream" style="--flow-delay:-1.0s" d="M340 224 H560"/><path class="flow-stream" style="--flow-delay:-2.0s" d="M560 288 H820"/><path class="flow-stream" style="--flow-delay:-3.0s" d="M820 352 H120"/><path class="flow-token" pathLength="1" d="M120 160 H340"/><path class="flow-token" pathLength="1" style="--flow-delay:-1.0s" d="M340 224 H560"/><path class="flow-token" pathLength="1" style="--flow-delay:-2.0s" d="M560 288 H820"/><path class="flow-token" pathLength="1" style="--flow-delay:-3.0s" d="M820 352 H120"/></g></svg><p class="legend">Flow mode · 4.6s cycle · lifelines establish ownership; moving messages show recurring API traffic.</p></main></body></html>
