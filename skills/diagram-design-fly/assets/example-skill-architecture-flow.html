<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How diagram-design-fly works</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --flow-cycle: 4s;
      --flow-ease: linear;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1160px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 34px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 760px; }
    .legend {
      margin: 16px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
      color: var(--color-muted);
      font: 500 12px/1.5 var(--font-mono);
    }

    /* Conduit dashes. Real user units, so every pipe shares one rhythm. */
    .flow-stream {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 5 9;
      pointer-events: none;
    }
    [data-motion-mode="flow"] .flow-stream {
      animation: flow-stream var(--flow-cycle) var(--flow-ease) infinite;
      animation-delay: var(--flow-delay, 0s);
    }
    @keyframes flow-stream { to { stroke-dashoffset: -70; } }

    /* Token. `stroke-dasharray: 0 gap` with a round cap draws a dot per gap. */
    .flow-token {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 0 var(--token-gap, 1);
      stroke-dashoffset: var(--token-gap, 1);
      pointer-events: none;
    }
    [data-motion-mode="flow"] .flow-token {
      animation: flow-token var(--flow-cycle) var(--flow-ease) infinite;
      animation-delay: var(--flow-delay, 0s);
    }
    @keyframes flow-token { to { stroke-dashoffset: 0; } }

    .flow-token-halo { stroke-width: 22; opacity: .16; }

    .flow-pulse {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      pointer-events: none;
    }
    [data-motion-mode="flow"] .flow-pulse {
      animation: flow-pulse var(--flow-cycle) var(--flow-ease) infinite;
      animation-delay: var(--flow-delay, 0s);
    }
    @keyframes flow-pulse {
      0%, 58% { opacity: 0; transform: scale(.985); }
      70%     { opacity: .55; transform: scale(1); }
      100%    { opacity: 0; transform: scale(1.02); }
    }

    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] * { animation: none !important; transition: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
      [data-motion-decorative] { display: none !important; }
    }
    @media print {
      body { padding: 0; }
      [data-motion-decorative] { display: none !important; }
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="flow" data-flow-cycle="4" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Architecture · Continuous flow</p>
    <h1>How diagram-design-fly works</h1>

    <svg viewBox="0 0 1160 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skill-architecture-flow-title skill-architecture-flow-desc">
      <title id="skill-architecture-flow-title">How diagram-design-fly works</title>
      <desc id="skill-architecture-flow-desc">A request enters SKILL.md, which routes to one of the reference guides and one of the asset templates. Those produce a self-contained diagram HTML file, which exports either to static SVG and PNG through Playwright, or to MP4, WebM and GIF through Remotion and ffmpeg.</desc>
      <defs>
        <marker id="skill-architecture-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>
      <rect width="1160" height="660" fill="#f5f5f5"/>

      <!-- ============ Base layer: complete without any motion ============ -->

      <!-- Authoring chain -->
      <path d="M286 123 H362" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#skill-architecture-flow-arrow)"/>
      <path d="M542 123 H618" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#skill-architecture-flow-arrow)"/>
      <path d="M798 123 H874" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#skill-architecture-flow-arrow)"/>
      <!-- Wrap: the chain folds back to the artifact on the row below -->
      <path d="M964 166 C964 250, 296 226, 296 310" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#skill-architecture-flow-arrow)"/>
      <!-- Export fan-out -->
      <path d="M486 360 C556 360, 560 298, 620 298" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#skill-architecture-flow-arrow)"/>
      <path d="M486 360 C556 360, 560 422, 620 422" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#skill-architecture-flow-arrow)"/>

      <!-- Stage 1 -->
      <g>
        <rect x="106" y="80" width="180" height="86" rx="8" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="126" y="106" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11" font-weight="500">01</text>
        <text x="196" y="126" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">Your request</text>
        <text x="196" y="148" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">prose · .mmd · .drawio</text>
      </g>
      <!-- Stage 2 -->
      <g>
        <rect x="362" y="80" width="180" height="86" rx="8" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="382" y="106" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11" font-weight="500">02</text>
        <text x="452" y="126" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">SKILL.md</text>
        <text x="452" y="148" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">pattern → visual type</text>
      </g>
      <!-- Stage 3 -->
      <g>
        <rect x="618" y="80" width="180" height="86" rx="8" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="638" y="106" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11" font-weight="500">03</text>
        <text x="708" y="126" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">references/</text>
        <text x="708" y="148" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">56 guides · loaded lazily</text>
      </g>
      <!-- Stage 4 -->
      <g>
        <rect x="874" y="80" width="180" height="86" rx="8" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="894" y="106" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11" font-weight="500">04</text>
        <text x="964" y="126" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">assets/</text>
        <text x="964" y="148" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">6 templates · 1 skin</text>
      </g>

      <!-- Hero artifact -->
      <g>
        <rect x="106" y="310" width="380" height="100" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.5"/>
        <text x="126" y="338" fill="#eb6c36" font-family="Geist Mono, monospace" font-size="11" font-weight="600">05</text>
        <text x="296" y="360" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="19" font-weight="600">Diagram HTML</text>
        <text x="296" y="384" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="12">one file · inline SVG + CSS · no runtime</text>
      </g>

      <!-- Static export -->
      <g>
        <rect x="620" y="258" width="434" height="80" rx="8" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="640" y="284" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11" font-weight="500">06</text>
        <text x="837" y="300" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">SVG · PNG</text>
        <text x="837" y="322" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">?motion=static → playwright</text>
      </g>
      <!-- Motion export -->
      <g>
        <rect x="620" y="382" width="434" height="80" rx="8" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="640" y="408" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11" font-weight="500">07</text>
        <text x="837" y="424" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">MP4 · WebM · GIF</text>
        <text x="837" y="446" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">frame-frozen CSS → remotion → ffmpeg</text>
      </g>


      <!-- ===== Footer: the prompt that made this figure ===== -->
      <line x1="60" y1="520" x2="1100" y2="520" stroke="#4f5d75" stroke-opacity=".14" stroke-width="1"/>
      <text x="60" y="546" fill="#eb6c36" font-family="Geist Mono, monospace" font-size="10" font-weight="600" letter-spacing="1.4">生成该图的指令 · PROMPT THAT MADE THIS</text>
      <text x="60" y="574" fill="#4f5d75" font-family="Geist Mono, 'Noto Sans SC', monospace" font-size="12">中文：画一张这个 skill 自身的架构图，用 flow 模式让请求在管线里流动起来。</text>
      <text x="60" y="596" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="12">EN: Draw an architecture diagram of this skill itself, with requests flowing through it in flow mode.</text>
      <text x="60" y="630" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">$ node scripts/render-video.mjs skills/diagram-design-fly/assets/example-skill-architecture-flow.html --format gif</text>

      <!-- ============ Flow layer: decorative, dropped for static ============ -->
      <g data-motion-decorative aria-hidden="true" focusable="false">
        <path class="flow-stream" d="M286 123 H362"/>
        <path class="flow-stream" style="--flow-delay:-.5s" d="M542 123 H618"/>
        <path class="flow-stream" style="--flow-delay:-1s" d="M798 123 H874"/>
        <path class="flow-stream" style="--flow-delay:-1.5s" d="M964 166 C964 250, 296 226, 296 310"/>
        <path class="flow-stream" style="--flow-delay:-2.6s" d="M486 360 C556 360, 560 298, 620 298"/>
        <path class="flow-stream" style="--flow-delay:-2.6s" d="M486 360 C556 360, 560 422, 620 422"/>

        <path class="flow-token flow-token-halo" pathLength="1" d="M286 123 H362"/>
        <path class="flow-token"                 pathLength="1" d="M286 123 H362"/>
        <path class="flow-token flow-token-halo" pathLength="1" style="--flow-delay:-.5s" d="M542 123 H618"/>
        <path class="flow-token"                 pathLength="1" style="--flow-delay:-.5s" d="M542 123 H618"/>
        <path class="flow-token flow-token-halo" pathLength="1" style="--flow-delay:-1s" d="M798 123 H874"/>
        <path class="flow-token"                 pathLength="1" style="--flow-delay:-1s" d="M798 123 H874"/>

        <!-- The long wrap carries three tokens so the curve never reads empty. -->
        <path class="flow-token flow-token-halo" pathLength="1" style="--token-gap:.3334; --flow-delay:-1.5s" d="M964 166 C964 250, 296 226, 296 310"/>
        <path class="flow-token"                 pathLength="1" style="--token-gap:.3334; --flow-delay:-1.5s" d="M964 166 C964 250, 296 226, 296 310"/>

        <path class="flow-token flow-token-halo" pathLength="1" style="--flow-delay:-2.6s" d="M486 360 C556 360, 560 298, 620 298"/>
        <path class="flow-token"                 pathLength="1" style="--flow-delay:-2.6s" d="M486 360 C556 360, 560 298, 620 298"/>
        <path class="flow-token flow-token-halo" pathLength="1" style="--flow-delay:-2.6s" d="M486 360 C556 360, 560 422, 620 422"/>
        <path class="flow-token"                 pathLength="1" style="--flow-delay:-2.6s" d="M486 360 C556 360, 560 422, 620 422"/>

        <rect class="flow-pulse" x="362" y="80" width="180" height="86" rx="8" fill="none" stroke="#eb6c36" stroke-width="2"/>
        <rect class="flow-pulse" x="618" y="80" width="180" height="86" rx="8" fill="none" stroke="#eb6c36" stroke-width="2" style="--flow-delay:-.5s"/>
        <rect class="flow-pulse" x="874" y="80" width="180" height="86" rx="8" fill="none" stroke="#eb6c36" stroke-width="2" style="--flow-delay:-1s"/>
        <rect class="flow-pulse" x="106" y="310" width="380" height="100" rx="8" fill="none" stroke="#eb6c36" stroke-width="2.5" style="--flow-delay:-1.5s"/>
        <rect class="flow-pulse" x="620" y="258" width="434" height="80" rx="8" fill="none" stroke="#eb6c36" stroke-width="2" style="--flow-delay:-2.6s"/>
        <rect class="flow-pulse" x="620" y="382" width="434" height="80" rx="8" fill="none" stroke="#eb6c36" stroke-width="2" style="--flow-delay:-2.6s"/>
      </g>
    </svg>

    <p class="legend">Flow mode · 4s cycle · pure CSS, no JavaScript · the same stylesheet drives the GIF above.</p>
  </main>
</body>
</html>
