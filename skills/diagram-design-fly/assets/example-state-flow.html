<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>订单状态机 · Flow</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"><style>
*,*::before,*::after{box-sizing:border-box}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--rule:rgba(45,49,66,.12);--sans:'Geist','Noto Sans SC',sans-serif;--mono:'Geist Mono',monospace;--serif:'Instrument Serif','Noto Sans SC',serif;--flow-cycle:5.2s;--flow-ease:linear}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:34px 24px;background:var(--paper);color:var(--ink);font-family:var(--sans)}[data-motion-root]{width:min(100%,1000px)}.eyebrow{margin:0 0 8px;color:var(--muted);font:500 12px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 20px;font:400 34px/1.15 var(--serif)}svg{display:block;width:100%;min-width:820px}.legend{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font:500 12px/1.5 var(--mono)}.flow-stream{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 9;pointer-events:none}[data-motion-mode="flow"] .flow-stream{animation:state-flow-stream var(--flow-cycle) var(--flow-ease) infinite;animation-delay:var(--flow-delay,0s)}@keyframes state-flow-stream{to{stroke-dashoffset:-70}}.flow-token{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;stroke-dasharray:0 1;stroke-dashoffset:1;pointer-events:none}[data-motion-mode="flow"] .flow-token{animation:state-flow-token var(--flow-cycle) var(--flow-ease) infinite;animation-delay:var(--flow-delay,0s)}@keyframes state-flow-token{to{stroke-dashoffset:0}}html[data-motion="static"] [data-motion-decorative]{display:none!important}html[data-motion="static"] *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){[data-motion-decorative]{display:none!important}}@media print{[data-motion-decorative]{display:none!important}*{animation:none!important}}.edge{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#state-flow-arrow)}.state{fill:var(--paper);stroke:var(--ink);stroke-width:1}.focal{fill:rgba(235,108,54,.08);stroke:var(--accent);stroke-width:1.2}.name{font:600 13px var(--sans);text-anchor:middle}.sub{fill:var(--soft);font:9px var(--mono);text-anchor:middle}.label{fill:var(--soft);font:9px var(--mono);text-anchor:middle}
</style></head><body><main data-motion-root data-motion-mode="flow" data-flow-cycle="5.2" data-frame="static" data-static-frame="complete"><p class="eyebrow">State machine · Order lifecycle</p><h1>订单状态机</h1><svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-flow-title state-flow-desc"><title id="state-flow-title">订单状态机</title><desc id="state-flow-desc">订单从待付款进入已付款，再发货，最后到完成。</desc><defs><marker id="state-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="980" height="420" fill="#f5f5f5"/><path class="edge" d="M180 176 H280"/><path class="edge" d="M420 176 H520"/><path class="edge" d="M660 176 H760"/><rect class="state" x="40" y="140" width="140" height="72" rx="8"/><rect class="state focal" x="280" y="140" width="140" height="72" rx="8"/><rect class="state" x="520" y="140" width="140" height="72" rx="8"/><rect class="state" x="760" y="140" width="140" height="72" rx="8"/><text class="name" x="110" y="172">待付款 Pending</text><text class="sub" x="110" y="192">created</text><text class="name" x="350" y="172" fill="#eb6c36">已付款 Paid</text><text class="sub" x="350" y="192">captured</text><text class="name" x="590" y="172">发货 Shipped</text><text class="sub" x="590" y="192">in transit</text><text class="name" x="830" y="172">完成 Complete</text><text class="sub" x="830" y="192">delivered</text><text class="label" x="230" y="160">PAY</text><text class="label" x="470" y="160">PACK</text><text class="label" x="710" y="160">DELIVER</text><line x1="60" y1="286" x2="920" y2="286" stroke="#4f5d75" stroke-opacity=".14"/><text x="60" y="312" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="10" font-weight="600" letter-spacing="1.2">生成该图的指令 · PROMPT THAT MADE THIS</text><text x="60" y="336" fill="#4f5d75" font-family="'Noto Sans SC','Geist',sans-serif" font-size="12">中文：画一个订单状态机，让订单持续从待付款流向已付款、发货和完成。</text><text x="60" y="360" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11">EN: Draw an order state machine flowing from pending payment to paid, shipped, and complete.</text><g data-motion-decorative aria-hidden="true" focusable="false"><path class="flow-stream" d="M180 176 H280"/><path class="flow-stream" style="--flow-delay:-1.3s" d="M420 176 H520"/><path class="flow-stream" style="--flow-delay:-2.6s" d="M660 176 H760"/><path class="flow-token" pathLength="1" d="M180 176 H280"/><path class="flow-token" pathLength="1" style="--flow-delay:-1.3s" d="M420 176 H520"/><path class="flow-token" pathLength="1" style="--flow-delay:-2.6s" d="M660 176 H760"/></g></svg><p class="legend">Flow mode · 5.2s cycle · states and transition labels remain legible without motion.</p></main></body></html>
