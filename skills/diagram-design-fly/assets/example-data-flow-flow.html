<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据流：从采集到消费</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --link: #2e5aa8; --rule: rgba(45,49,66,.12);
      --sans: 'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Sans SC', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
      --flow-cycle: 4.4s; --flow-ease: linear;
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 24px; color: var(--ink); background: var(--paper); font-family: var(--sans); }
    [data-motion-root] { width: min(100%, 920px); }
    .eyebrow { margin: 0 0 8px; color: var(--muted); font: 500 12px/1.4 var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0 0 18px; font: 400 34px/1.15 var(--serif); }
    svg { display: block; width: 100%; min-width: 720px; }
    .legend { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font: 500 12px/1.6 var(--mono); }
    .flow-stream { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 5 9; pointer-events: none; }
    [data-motion-mode="flow"] .flow-stream { animation: data-flow-flow-stream var(--flow-cycle) var(--flow-ease) infinite; animation-delay: var(--flow-delay, 0s); }
    @keyframes data-flow-flow-stream { to { stroke-dashoffset: -70; } }
    .flow-token { fill: none; stroke: var(--accent); stroke-width: 11; stroke-linecap: round; stroke-dasharray: 0 var(--token-gap, 1); stroke-dashoffset: var(--token-gap, 1); pointer-events: none; }
    [data-motion-mode="flow"] .flow-token { animation: data-flow-flow-token var(--flow-cycle) var(--flow-ease) infinite; animation-delay: var(--flow-delay, 0s); }
    @keyframes data-flow-flow-token { to { stroke-dashoffset: 0; } }
    .flow-token-halo { stroke-width: 20; opacity: .16; }
    .flow-pulse { opacity: 0; transform-box: fill-box; transform-origin: center; pointer-events: none; }
    [data-motion-mode="flow"] .flow-pulse { animation: data-flow-flow-pulse var(--flow-cycle) var(--flow-ease) infinite; animation-delay: var(--flow-delay, 0s); }
    @keyframes data-flow-flow-pulse { 0%, 60% { opacity: 0; transform: scale(.985); } 71% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.02); } }
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] * { animation: none !important; transition: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } [data-motion-decorative] { display: none !important; } }
    @media print { body { padding: 0; } [data-motion-decorative] { display: none !important; } * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="flow" data-flow-cycle="4.4" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Data flow · Continuous movement</p>
    <h1>数据流：从采集到消费</h1>
    <svg viewBox="0 0 1040 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-flow-flow-title data-flow-flow-desc">
      <title id="data-flow-flow-title">数据流：从采集到消费</title>
      <desc id="data-flow-flow-desc">数据从事件采集进入清洗与质量校验，再写入分析存储，最后被报表和产品服务消费。动画用连续的 CSS 流动提示数据正在穿过管线。</desc>
      <defs>
        <pattern id="data-flow-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".8" fill="rgba(45,49,66,.10)"/></pattern>
        <marker id="data-flow-flow-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4f5d75"/></marker>
        <marker id="data-flow-flow-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6c36"/></marker>
        <marker id="data-flow-flow-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1040" height="290" fill="#f5f5f5"/><rect width="1040" height="290" fill="url(#data-flow-flow-dots)" opacity=".45"/>
      <rect x="0" y="36" width="1040" height="80" fill="rgba(45,49,66,.018)"/>
      <path d="M240 76 H380" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#data-flow-flow-arr-accent)"/>
      <path d="M480 76 H620" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#data-flow-flow-arr-muted)"/>
      <path d="M720 76 H860" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#data-flow-flow-arr-link)"/>
      <line x1="140" y1="36" x2="140" y2="116" stroke="rgba(45,49,66,.12)" stroke-width=".8"/><line x1="0" y1="36" x2="1040" y2="36" stroke="rgba(45,49,66,.12)"/><line x1="0" y1="116" x2="1040" y2="116" stroke="rgba(45,49,66,.12)"/>
      <g font-family="'Geist Mono','Noto Sans SC',monospace" font-size="7" font-weight="500" text-anchor="middle" fill="#4f5d75"><rect x="174" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,.12)"/><text x="190" y="14" fill="#2d3142">01</text><text x="190" y="29">COLLECT</text><rect x="414" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="430" y="14" fill="#eb6c36">02</text><text x="430" y="29" fill="#eb6c36">CLEAN</text><rect x="654" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,.12)"/><text x="670" y="14" fill="#2d3142">03</text><text x="670" y="29">STORE</text><rect x="894" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,.12)"/><text x="910" y="14" fill="#2d3142">04</text><text x="910" y="29">CONSUME</text></g>
      <g font-family="'Geist Mono','Noto Sans SC',monospace" font-size="7" font-weight="500" fill="#4f5d75" text-anchor="middle"><text x="70" y="72">DATA</text><text x="70" y="84">PIPELINE</text></g>
      <g stroke="#2d3142" stroke-width="1">
        <rect x="140" y="44" width="100" height="64" rx="6" fill="#fff"/><rect x="380" y="44" width="100" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/><rect x="620" y="44" width="100" height="64" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><rect x="860" y="44" width="100" height="64" rx="6" fill="#fff" stroke="#2e5aa8"/>
      </g>
      <g font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle"><g fill="#2d3142" font-size="9" font-weight="600"><text x="190" y="67">Event capture</text><text x="430" y="67" fill="#eb6c36">Clean &amp; validate</text><text x="670" y="67">Warehouse</text><text x="910" y="67">Dashboards</text></g><g fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="6.5"><text x="190" y="79">events · logs · API</text><text x="430" y="79">schema · quality gate</text><text x="670" y="79">partitioned tables</text><text x="910" y="79">reports · products</text></g><g fill="#7a8399" font-family="'Geist Mono',monospace" font-size="6.5"><text x="190" y="91">collector / edge</text><text x="430" y="91">stream processor</text><text x="670" y="91">lakehouse</text><text x="910" y="91">read-only views</text></g></g>
      <g font-family="'Geist Mono',monospace" font-size="6" text-anchor="middle"><rect x="144" y="98" width="16" height="8" rx="3" fill="rgba(79,93,117,.12)"/><text x="152" y="104" fill="#4f5d75">WB</text><rect x="224" y="98" width="16" height="8" rx="3" fill="rgba(79,93,117,.12)"/><text x="232" y="104" fill="#4f5d75">DB</text><rect x="384" y="98" width="16" height="8" rx="3" fill="rgba(79,93,117,.12)"/><text x="392" y="104" fill="#4f5d75">DB</text><rect x="464" y="98" width="16" height="8" rx="3" fill="rgba(79,93,117,.12)"/><text x="472" y="104" fill="#4f5d75">TB</text><rect x="624" y="98" width="16" height="8" rx="3" fill="rgba(79,93,117,.12)"/><text x="632" y="104" fill="#4f5d75">TB</text><rect x="704" y="98" width="16" height="8" rx="3" fill="rgba(79,93,117,.12)"/><text x="712" y="104" fill="#4f5d75">DB</text><rect x="864" y="98" width="16" height="8" rx="3" fill="rgba(79,93,117,.12)"/><text x="872" y="104" fill="#4f5d75">DB</text><rect x="944" y="98" width="16" height="8" rx="3" fill="rgba(79,93,117,.12)"/><text x="952" y="104" fill="#4f5d75">FL</text></g>
      <rect x="190" y="150" width="720" height="1" fill="#4f5d75" opacity=".14"/>
      <text x="190" y="176" text-anchor="start" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="10" font-weight="600" letter-spacing="1.2">生成该图的指令 · PROMPT THAT MADE THIS</text>
      <text x="190" y="202" text-anchor="start" fill="#4f5d75" font-family="'Geist','Noto Sans SC',sans-serif" font-size="12">中文：画一张数据从采集、清洗、存储到消费的 flow 数据流图。</text>
      <text x="190" y="226" text-anchor="start" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11">EN: Draw a flow data diagram from collection through cleaning, storage, and consumption.</text>
      <text x="190" y="250" text-anchor="start" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="10">CSS-only · one clock · payload tokens normalized with pathLength="1"</text>
      <g data-motion-decorative aria-hidden="true" focusable="false">
        <path class="flow-stream" d="M240 76 H380"/>
        <path class="flow-stream" style="--flow-delay:-1.1s" d="M480 76 H620"/>
        <path class="flow-stream" style="--flow-delay:-2.2s" d="M720 76 H860"/>
        <path class="flow-token flow-token-halo" pathLength="1" d="M240 76 H380"/><path class="flow-token" pathLength="1" d="M240 76 H380"/>
        <path class="flow-token flow-token-halo" pathLength="1" style="--flow-delay:-1.1s" d="M480 76 H620"/><path class="flow-token" pathLength="1" style="--flow-delay:-1.1s" d="M480 76 H620"/>
        <path class="flow-token flow-token-halo" pathLength="1" style="--flow-delay:-2.2s" d="M720 76 H860"/><path class="flow-token" pathLength="1" style="--flow-delay:-2.2s" d="M720 76 H860"/>
        <rect class="flow-pulse" x="380" y="44" width="100" height="64" rx="6" fill="none" stroke="#eb6c36" stroke-width="2" style="--flow-delay:-1.1s"/><rect class="flow-pulse" x="620" y="44" width="100" height="64" rx="6" fill="none" stroke="#eb6c36" stroke-width="2" style="--flow-delay:-2.2s"/><rect class="flow-pulse" x="860" y="44" width="100" height="64" rx="6" fill="none" stroke="#eb6c36" stroke-width="2" style="--flow-delay:-3.3s"/>
      </g>
    </svg>
    <p class="legend">Flow mode · 4.4s cycle · pure CSS · static frame remains complete without the decorative flow layer.</p>
  </main>
</body>
</html>
