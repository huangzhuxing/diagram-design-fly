<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How flow mode works</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --flow-cycle: 3.2s;
      --flow-ease: linear;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1160px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 34px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 760px; }
    .legend {
      margin: 16px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
      color: var(--color-muted);
      font: 500 12px/1.5 var(--font-mono);
    }

    .flow-stream {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 5 9;
      pointer-events: none;
    }
    [data-motion-mode="flow"] .flow-stream {
      animation: flow-stream var(--flow-cycle) var(--flow-ease) infinite;
      animation-delay: var(--flow-delay, 0s);
    }
    @keyframes flow-stream { to { stroke-dashoffset: -70; } }

    .flow-token {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 0 var(--token-gap, 1);
      stroke-dashoffset: var(--token-gap, 1);
      pointer-events: none;
    }
    [data-motion-mode="flow"] .flow-token {
      animation: flow-token var(--flow-cycle) var(--flow-ease) infinite;
      animation-delay: var(--flow-delay, 0s);
    }
    @keyframes flow-token { to { stroke-dashoffset: 0; } }

    .flow-token-halo { stroke-width: 22; opacity: .16; }

    .flow-pulse {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      pointer-events: none;
    }
    [data-motion-mode="flow"] .flow-pulse {
      animation: flow-pulse var(--flow-cycle) var(--flow-ease) infinite;
      animation-delay: var(--flow-delay, 0s);
    }
    @keyframes flow-pulse {
      0%, 58% { opacity: 0; transform: scale(.985); }
      70%     { opacity: .55; transform: scale(1); }
      100%    { opacity: 0; transform: scale(1.02); }
    }

    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] * { animation: none !important; transition: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
      [data-motion-decorative] { display: none !important; }
    }
    @media print {
      body { padding: 0; }
      [data-motion-decorative] { display: none !important; }
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="flow" data-flow-cycle="3.2" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Mechanism · Continuous flow</p>
    <h1>How flow mode works</h1>

    <svg viewBox="0 0 1160 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-mechanism-flow-title flow-mechanism-flow-desc">
      <title id="flow-mechanism-flow-title">How flow mode works</title>
      <desc id="flow-mechanism-flow-desc">All flow motion is one animated stroke-dashoffset. A dasharray of five on and nine off makes a conduit of crawling dashes; a zero-length dash with a round cap makes a travelling dot, and the gap size sets how many dots ride the path. That single stylesheet then feeds two clocks: the browser advances time normally, while the video renderer pauses the animation and seeks it with a negative delay per frame, so both produce identical pixels.</desc>
      <defs>
        <marker id="flow-mechanism-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>
      <rect width="1160" height="840" fill="#f5f5f5"/>

      <!-- ============ 01 · one declaration, three specimens ============ -->
      <text x="60" y="62" fill="#eb6c36" font-family="Geist Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.6">01 · ONE DECLARATION</text>
      <line x1="60" y1="76" x2="1100" y2="76" stroke="#eb6c36" stroke-opacity=".3" stroke-width="1"/>

      <text x="60" y="112" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="12">@keyframes → stroke-dashoffset · every specimen below is that one animation</text>

      <!-- specimen A: conduit -->
      <text x="60" y="164" fill="#2d3142" font-family="Geist Mono, monospace" font-size="12" font-weight="600">stroke-dasharray: 5 9</text>
      <text x="60" y="184" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">conduit · dashes crawl</text>
      <line x1="330" y1="170" x2="850" y2="170" stroke="#4f5d75" stroke-opacity=".2" stroke-width="1"/>
      <text x="880" y="175" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">no pathLength — dash size</text>
      <text x="880" y="193" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">stays constant in user units</text>

      <!-- specimen B: one token -->
      <text x="60" y="248" fill="#2d3142" font-family="Geist Mono, monospace" font-size="12" font-weight="600">stroke-dasharray: 0 1</text>
      <text x="60" y="268" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">+ linecap round → a dot</text>
      <line x1="330" y1="254" x2="850" y2="254" stroke="#4f5d75" stroke-opacity=".2" stroke-width="1"/>
      <text x="880" y="259" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">pathLength="1" — one crossing</text>
      <text x="880" y="277" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">per cycle at any length</text>

      <!-- specimen C: three tokens -->
      <text x="60" y="332" fill="#2d3142" font-family="Geist Mono, monospace" font-size="12" font-weight="600">stroke-dasharray: 0 .3334</text>
      <text x="60" y="352" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">the gap sets the count</text>
      <line x1="330" y1="338" x2="850" y2="338" stroke="#4f5d75" stroke-opacity=".2" stroke-width="1"/>
      <text x="880" y="343" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">three dots, evenly spaced,</text>
      <text x="880" y="361" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">from the same keyframe</text>

      <!-- ============ 02 · two clocks ============ -->
      <text x="60" y="430" fill="#eb6c36" font-family="Geist Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.6">02 · TWO CLOCKS, ONE STYLESHEET</text>
      <line x1="60" y1="444" x2="1100" y2="444" stroke="#eb6c36" stroke-opacity=".3" stroke-width="1"/>

      <path d="M580 526 C580 560, 320 552, 320 586" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#flow-mechanism-flow-arrow)"/>
      <path d="M580 526 C580 560, 840 552, 840 586" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#flow-mechanism-flow-arrow)"/>

      <g>
        <rect x="430" y="470" width="300" height="56" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.5"/>
        <text x="580" y="504" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="15" font-weight="600">the authored @keyframes</text>
      </g>

      <g>
        <rect x="90" y="586" width="460" height="86" rx="8" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="320" y="620" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">Browser · live HTML</text>
        <text x="320" y="644" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">the browser advances time</text>
      </g>
      <g>
        <rect x="610" y="586" width="460" height="86" rx="8" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1.5"/>
        <text x="840" y="614" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">Remotion · MP4 · WebM · GIF</text>
        <text x="840" y="636" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">animation-play-state: paused</text>
        <text x="840" y="654" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">animation-delay: calc(--flow-delay − t)</text>
      </g>


      <!-- ===== Footer: the prompt that made this figure ===== -->
      <line x1="60" y1="700" x2="1100" y2="700" stroke="#4f5d75" stroke-opacity=".14" stroke-width="1"/>
      <text x="60" y="726" fill="#eb6c36" font-family="Geist Mono, monospace" font-size="10" font-weight="600" letter-spacing="1.4">生成该图的指令 · PROMPT THAT MADE THIS</text>
      <text x="60" y="754" fill="#4f5d75" font-family="Geist Mono, 'Noto Sans SC', monospace" font-size="12">中文：画一张说明 flow 动效原理的图，把 stroke-dashoffset 的三种形态做成能直接看到的实例。</text>
      <text x="60" y="776" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="12">EN: Draw a diagram explaining how flow mode works, with live specimens of each stroke-dashoffset form.</text>
      <text x="60" y="810" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">$ node scripts/render-video.mjs skills/diagram-design-fly/assets/example-flow-mechanism-flow.html --format gif</text>

      <!-- ===== Flow layer ===== -->
      <g data-motion-decorative aria-hidden="true" focusable="false">
        <!-- specimens: the diagram demonstrates the mechanism using the mechanism -->
        <path class="flow-stream" d="M330 170 H850"/>

        <path class="flow-token flow-token-halo" pathLength="1" d="M330 254 H850"/>
        <path class="flow-token"                 pathLength="1" d="M330 254 H850"/>

        <path class="flow-token" pathLength="1" style="--token-gap:.3334" d="M330 338 H850"/>

        <!-- the split to two clocks -->
        <path class="flow-stream" style="--flow-delay:-1.1s" d="M580 526 C580 560, 320 552, 320 586"/>
        <path class="flow-stream" style="--flow-delay:-1.1s" d="M580 526 C580 560, 840 552, 840 586"/>
        <path class="flow-token flow-token-halo" pathLength="1" style="--flow-delay:-1.1s" d="M580 526 C580 560, 320 552, 320 586"/>
        <path class="flow-token"                 pathLength="1" style="--flow-delay:-1.1s" d="M580 526 C580 560, 320 552, 320 586"/>
        <path class="flow-token flow-token-halo" pathLength="1" style="--flow-delay:-1.1s" d="M580 526 C580 560, 840 552, 840 586"/>
        <path class="flow-token"                 pathLength="1" style="--flow-delay:-1.1s" d="M580 526 C580 560, 840 552, 840 586"/>

        <rect class="flow-pulse" x="90" y="586" width="460" height="86" rx="8" fill="none" stroke="#eb6c36" stroke-width="2" style="--flow-delay:-1.1s"/>
        <rect class="flow-pulse" x="610" y="586" width="460" height="86" rx="8" fill="none" stroke="#eb6c36" stroke-width="2" style="--flow-delay:-1.1s"/>
      </g>
    </svg>

    <p class="legend">The three specimens above are live: each is the exact declaration printed beside it. Same keyframes, same stylesheet — only the clock differs.</p>
  </main>
</body>
</html>
