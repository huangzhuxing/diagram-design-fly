<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目甘特图</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--p:#f5f5f5;--i:#2d3142;--m:#4f5d75;--s:#7a8399;--a:#eb6c36;--r:rgba(45,49,66,.12);--sans:'Geist','Noto Sans SC',sans-serif;--mono:'Geist Mono',monospace;--flow-cycle:4s}*{box-sizing:border-box}body{margin:0;padding:36px 28px;background:var(--p);color:var(--i);font-family:var(--sans)}main{max-width:1080px;margin:auto}.eyebrow{font:500 11px var(--mono);letter-spacing:.16em;color:var(--m)}h1{font:400 34px 'Instrument Serif','Noto Sans SC',serif;margin:8px 0 18px}svg{width:100%;display:block;overflow:visible}.phase{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.1)}.bar{fill:rgba(79,93,117,.15);stroke:var(--m)}.focal{fill:rgba(235,108,54,.12);stroke:var(--a)}.task{fill:var(--i);font-size:12px;font-weight:600}.meta{font:10px var(--mono);fill:var(--m)}.axis{font:10px var(--mono);fill:var(--m);text-anchor:middle}.dep{fill:none;stroke:var(--m);stroke-width:1.4}.flow-seq circle{fill:var(--i);stroke:var(--p);stroke-width:3}.flow-seq>text{fill:var(--p);font:600 11px var(--mono);text-anchor:middle;dominant-baseline:middle}.legend{border-top:1px solid var(--r);padding-top:14px;font:11px var(--mono);color:var(--m)}.flow-stream{fill:none;stroke:var(--a);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 9}.flow-token{fill:none;stroke:var(--a);stroke-width:10;stroke-linecap:round;stroke-dasharray:0 1;stroke-dashoffset:1}.flow-pulse{opacity:0;transform-box:fill-box;transform-origin:center}[data-motion-mode="flow"] .flow-stream{animation:gantt-flow-stream var(--flow-cycle) linear infinite;animation-delay:var(--flow-delay,0s)}[data-motion-mode="flow"] .flow-token{animation:gantt-flow-token var(--flow-cycle) linear infinite;animation-delay:var(--flow-delay,0s)}[data-motion-mode="flow"] .flow-pulse{animation:gantt-flow-pulse var(--flow-cycle) linear infinite;animation-delay:var(--flow-delay,0s)}@keyframes gantt-flow-stream{to{stroke-dashoffset:-70}}@keyframes gantt-flow-token{to{stroke-dashoffset:0}}@keyframes gantt-flow-pulse{0%,62%{opacity:0}72%{opacity:.5}100%{opacity:0}}html[data-motion="static"] [data-motion-decorative]{display:none!important}html[data-motion="static"] *{animation:none!important}@media (prefers-reduced-motion:reduce){[data-motion-decorative]{display:none!important}*{animation:none!important}}@media print{[data-motion-decorative]{display:none!important}*{animation:none!important}}
</style></head><body><main data-motion-root data-motion-mode="flow" data-flow-cycle="4" data-flow-sequence="4"><p class="eyebrow">Gantt · Continuous flow</p><h1>项目交付计划 Project delivery plan</h1><svg viewBox="0 0 1040 480" role="img" aria-labelledby="gantt-flow-title gantt-flow-desc"><title id="gantt-flow-title">项目甘特图 Project Gantt chart</title><desc id="gantt-flow-desc">四条任务分为发现和交付两组，展示重叠与依赖 Four tasks in discovery and delivery phases with overlap and dependencies.</desc><defs><marker id="gantt-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker></defs><rect width="1040" height="480" style="fill:var(--p)"/><g class="axis"><text x="260" y="48">W1</text><text x="400" y="48">W2</text><text x="540" y="48">W3</text><text x="680" y="48">W4</text><text x="820" y="48">W5</text><text x="940" y="48">W6</text></g><path d="M200 60H976" stroke="var(--r)"/><g stroke="var(--r)"><path d="M260 60V326M400 60V326M540 60V326M680 60V326M820 60V326M940 60V326"/></g><rect class="phase" x="20" y="76" width="956" height="96" rx="6"/><rect class="phase" x="20" y="188" width="956" height="96" rx="6"/><text x="36" y="94" font-family="var(--mono)" font-size="10" style="fill:var(--m)" font-weight="600">DISCOVERY / 发现</text><text x="36" y="206" font-family="var(--mono)" font-size="10" style="fill:var(--m)" font-weight="600">DELIVERY / 交付</text><g class="task"><text x="36" y="125">用户研究 User research</text><text x="36" y="165">交互原型 Interaction prototype</text><text x="36" y="237">工程实现 Engineering build</text><text x="36" y="277">上线复盘 Launch review</text></g><g><rect class="bar" x="200" y="108" width="280" height="24" rx="4"/><rect class="bar focal" x="340" y="148" width="280" height="24" rx="4"/><rect class="bar" x="480" y="220" width="350" height="24" rx="4"/><rect class="bar" x="760" y="260" width="140" height="24" rx="4"/></g><g class="flow-seq" data-seq="1"><circle cx="200" cy="108" r="13"/><text x="200" y="108">1</text></g><g class="flow-seq" data-seq="2"><circle cx="340" cy="148" r="13"/><text x="340" y="148">2</text></g><g class="flow-seq" data-seq="3"><circle cx="480" cy="220" r="13"/><text x="480" y="220">3</text></g><g class="flow-seq" data-seq="4"><circle cx="760" cy="260" r="13"/><text x="760" y="260">4</text><g class="meta"><text x="200" y="350">依赖 Dependencies</text><text x="200" y="370">研究 → 原型 → 工程 → 复盘</text></g><path class="dep" d="M480 120V180H480V220" marker-end="url(#gantt-flow-arrow)"/><path class="dep" d="M620 160V200H760V260" marker-end="url(#gantt-flow-arrow)"/><line x1="64" y1="398" x2="976" y2="398" stroke="var(--r)"/><text x="64" y="422" style="fill:var(--a)" font-family="var(--mono)" font-size="10" font-weight="600">生成该图的指令 · PROMPT THAT MADE THIS</text><text x="64" y="444" style="fill:var(--m)" font-size="11">中文：画一个 4 条任务、2 个分组并带依赖关系的项目甘特图。</text><text x="64" y="464" style="fill:var(--m)" font-size="11">EN: Draw a project Gantt chart with four tasks, two groups, and dependencies.</text><g data-motion-decorative aria-hidden="true" focusable="false"><path class="flow-stream" d="M200 120H480"/><path class="flow-stream" style="--flow-delay:-.8s" d="M340 160H620"/><path class="flow-stream" style="--flow-delay:-1.6s" d="M480 232H830"/><path class="flow-stream" style="--flow-delay:-2.4s" d="M760 272H900"/><path class="flow-token" pathLength="1" d="M200 120H480"/><path class="flow-token" pathLength="1" style="--flow-delay:-.8s" d="M340 160H620"/><path class="flow-token" pathLength="1" style="--flow-delay:-1.6s" d="M480 232H830"/><path class="flow-token" pathLength="1" style="--flow-delay:-2.4s" d="M760 272H900"/><rect class="flow-pulse" x="475" y="103" width="10" height="34" rx="4" fill="none" stroke="var(--a)" stroke-width="2"/></g></svg><p class="legend">Flow mode · 4s cycle · task throughput / 任务推进</p></main></body></html>
