<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What this fork adds</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --flow-cycle: 3.6s;
      --flow-ease: linear;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1160px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 34px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 760px; }
    .legend {
      margin: 16px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
      color: var(--color-muted);
      font: 500 12px/1.5 var(--font-mono);
    }

    .flow-stream {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 5 9;
      pointer-events: none;
    }
    [data-motion-mode="flow"] .flow-stream {
      animation: flow-stream var(--flow-cycle) var(--flow-ease) infinite;
      animation-delay: var(--flow-delay, 0s);
    }
    @keyframes flow-stream { to { stroke-dashoffset: -70; } }

    .flow-token {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 0 var(--token-gap, 1);
      stroke-dashoffset: var(--token-gap, 1);
      pointer-events: none;
    }
    [data-motion-mode="flow"] .flow-token {
      animation: flow-token var(--flow-cycle) var(--flow-ease) infinite;
      animation-delay: var(--flow-delay, 0s);
    }
    @keyframes flow-token { to { stroke-dashoffset: 0; } }

    .flow-token-halo { stroke-width: 22; opacity: .16; }

    .flow-pulse {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      pointer-events: none;
    }
    [data-motion-mode="flow"] .flow-pulse {
      animation: flow-pulse var(--flow-cycle) var(--flow-ease) infinite;
      animation-delay: var(--flow-delay, 0s);
    }
    @keyframes flow-pulse {
      0%, 56% { opacity: 0; transform: scale(.985); }
      68%     { opacity: .55; transform: scale(1); }
      100%    { opacity: 0; transform: scale(1.02); }
    }

    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] * { animation: none !important; transition: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
      [data-motion-decorative] { display: none !important; }
    }
    @media print {
      body { padding: 0; }
      [data-motion-decorative] { display: none !important; }
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="flow" data-flow-cycle="3.6" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Before / after · Continuous flow</p>
    <h1>What this fork adds</h1>

    <svg viewBox="0 0 1160 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fork-delta-flow-title fork-delta-flow-desc">
      <title id="fork-delta-flow-title">What this fork adds</title>
      <desc id="fork-delta-flow-desc">Upstream 2.6.17 offers four motion modes, of which only loop repeats and it is capped at a single token on a single edge, and exports a diagram to SVG or PNG. This fork adds a fifth mode, flow, which animates up to eight connectors and sixteen tokens with no JavaScript, plus a video export path to MP4, WebM and GIF, and a dedicated verifier with sixteen adversarial tests.</desc>
      <defs>
        <marker id="fork-delta-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="fork-delta-flow-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#7a8399"/>
        </marker>
      </defs>
      <rect width="1160" height="700" fill="#f5f5f5"/>

      <!-- ================= BAND A · upstream, deliberately still ================= -->
      <text x="60" y="66" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.6">UPSTREAM 2.6.17</text>
      <line x1="60" y1="80" x2="1100" y2="80" stroke="#4f5d75" stroke-opacity=".14" stroke-width="1"/>

      <path d="M420 152 H556" fill="none" stroke="#7a8399" stroke-width="1.5" marker-end="url(#fork-delta-flow-arrow-soft)"/>

      <g>
        <rect x="60" y="108" width="360" height="88" rx="8" fill="#f5f5f5" stroke="#7a8399"/>
        <text x="240" y="146" text-anchor="middle" fill="#4f5d75" font-family="Geist, sans-serif" font-size="17" font-weight="600">Diagram HTML</text>
        <text x="240" y="170" text-anchor="middle" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">none · reveal · step · loop</text>
      </g>
      <g>
        <rect x="556" y="108" width="300" height="88" rx="8" fill="#f5f5f5" stroke="#7a8399"/>
        <text x="706" y="146" text-anchor="middle" fill="#4f5d75" font-family="Geist, sans-serif" font-size="17" font-weight="600">SVG · PNG</text>
        <text x="706" y="170" text-anchor="middle" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">static final frame only</text>
      </g>
      <text x="896" y="140" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">loop = 1 token, 1 edge</text>
      <text x="896" y="160" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">no video path</text>
      <text x="896" y="180" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">nothing here moves</text>

      <!-- ================= BAND B · this fork ================= -->
      <text x="60" y="286" fill="#eb6c36" font-family="Geist Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.6">THIS FORK · FLOW MODE</text>
      <line x1="60" y1="300" x2="1100" y2="300" stroke="#eb6c36" stroke-opacity=".3" stroke-width="1"/>

      <path d="M420 400 C486 400, 490 372, 556 372" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fork-delta-flow-arrow)"/>
      <path d="M420 400 C486 400, 490 500, 556 500" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fork-delta-flow-arrow)"/>

      <g>
        <rect x="60" y="356" width="360" height="88" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.5"/>
        <text x="240" y="394" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="17" font-weight="600">Diagram HTML</text>
        <text x="240" y="418" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">+ flow · 8 connectors · 16 tokens · 0 JS</text>
      </g>
      <g>
        <rect x="556" y="332" width="300" height="80" rx="8" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="706" y="366" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">SVG · PNG</text>
        <text x="706" y="388" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">unchanged</text>
      </g>
      <g>
        <rect x="556" y="460" width="300" height="80" rx="8" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1.5"/>
        <text x="706" y="494" text-anchor="middle" fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600">MP4 · WebM · GIF</text>
        <text x="706" y="516" text-anchor="middle" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">remotion · ffmpeg</text>
        <rect x="812" y="446" width="40" height="18" rx="9" fill="#eb6c36"/>
        <text x="832" y="459" text-anchor="middle" fill="#f5f5f5" font-family="Geist Mono, monospace" font-size="10" font-weight="600">NEW</text>
      </g>

      <text x="896" y="360" fill="#2d3142" font-family="Geist Mono, monospace" font-size="11" font-weight="600">what is new</text>
      <text x="896" y="382" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">flow.md · template-flow</text>
      <text x="896" y="402" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">video-export.md</text>
      <text x="896" y="422" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">verify-flow.py + 16 tests</text>
      <text x="896" y="442" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="11">ADR 0011 · cap 40k→42k</text>
      <text x="896" y="500" fill="#eb6c36" font-family="Geist Mono, monospace" font-size="11" font-weight="600">this band is moving</text>
      <text x="896" y="520" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">the one above is not</text>


      <!-- ===== Footer: the prompt that made this figure ===== -->
      <line x1="60" y1="558" x2="1100" y2="558" stroke="#4f5d75" stroke-opacity=".14" stroke-width="1"/>
      <text x="60" y="584" fill="#eb6c36" font-family="Geist Mono, monospace" font-size="10" font-weight="600" letter-spacing="1.4">生成该图的指令 · PROMPT THAT MADE THIS</text>
      <text x="60" y="612" fill="#4f5d75" font-family="Geist Mono, 'Noto Sans SC', monospace" font-size="12">中文：画一张对比图，展示这个 fork 相比上游多了什么；上半部分保持静止，下半部分用 flow 动起来。</text>
      <text x="60" y="634" fill="#4f5d75" font-family="Geist Mono, monospace" font-size="12">EN: Draw a before/after of what this fork adds — upper band deliberately still, lower band flowing.</text>
      <text x="60" y="668" fill="#7a8399" font-family="Geist Mono, monospace" font-size="11">$ node scripts/render-video.mjs skills/diagram-design-fly/assets/example-fork-delta-flow.html --format gif</text>

      <!-- ===== Flow layer: only band B, which is the entire argument ===== -->
      <g data-motion-decorative aria-hidden="true" focusable="false">
        <path class="flow-stream" d="M420 400 C486 400, 490 372, 556 372"/>
        <path class="flow-stream" d="M420 400 C486 400, 490 500, 556 500"/>

        <path class="flow-token flow-token-halo" pathLength="1" d="M420 400 C486 400, 490 372, 556 372"/>
        <path class="flow-token"                 pathLength="1" d="M420 400 C486 400, 490 372, 556 372"/>
        <path class="flow-token flow-token-halo" pathLength="1" d="M420 400 C486 400, 490 500, 556 500"/>
        <path class="flow-token"                 pathLength="1" d="M420 400 C486 400, 490 500, 556 500"/>

        <rect class="flow-pulse" x="556" y="332" width="300" height="80" rx="8" fill="none" stroke="#eb6c36" stroke-width="2"/>
        <rect class="flow-pulse" x="556" y="460" width="300" height="80" rx="8" fill="none" stroke="#eb6c36" stroke-width="2"/>
      </g>
    </svg>

    <p class="legend">The upper band is drawn with the same skill and deliberately carries no flow layer. The contrast is the changelog.</p>
  </main>
</body>
</html>
