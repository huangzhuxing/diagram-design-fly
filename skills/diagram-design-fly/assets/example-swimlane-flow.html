<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>跨部门交付流程 · Flow</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"><style>
*,*::before,*::after{box-sizing:border-box}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--rule:rgba(45,49,66,.12);--sans:'Geist','Noto Sans SC',sans-serif;--mono:'Geist Mono',monospace;--serif:'Instrument Serif','Noto Sans SC',serif;--flow-cycle:4.8s;--flow-ease:linear}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:30px 20px;background:var(--paper);color:var(--ink);font-family:var(--sans)}[data-motion-root]{width:min(100%,1160px)}.eyebrow{margin:0 0 8px;color:var(--muted);font:500 12px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 18px;font:400 34px/1.15 var(--serif)}svg{display:block;width:100%;min-width:980px}.legend{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font:500 12px/1.5 var(--mono)}.flow-stream{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 9;pointer-events:none}[data-motion-mode="flow"] .flow-stream{animation:swimlane-flow-stream var(--flow-cycle) var(--flow-ease) infinite;animation-delay:var(--flow-delay,0s)}@keyframes swimlane-flow-stream{to{stroke-dashoffset:-70}}.flow-token{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;stroke-dasharray:0 1;stroke-dashoffset:1;pointer-events:none}[data-motion-mode="flow"] .flow-token{animation:swimlane-flow-token var(--flow-cycle) var(--flow-ease) infinite;animation-delay:var(--flow-delay,0s)}@keyframes swimlane-flow-token{to{stroke-dashoffset:0}}html[data-motion="static"] [data-motion-decorative]{display:none!important}html[data-motion="static"] *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){[data-motion-decorative]{display:none!important}}@media print{[data-motion-decorative]{display:none!important}*{animation:none!important}}.lane{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.16);stroke-width:1}.edge{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#swimlane-flow-arrow)}.step{fill:var(--paper);stroke:var(--ink);stroke-width:1}.handoff{fill:rgba(235,108,54,.08);stroke:var(--accent);stroke-width:1.2}.name{font:600 13px var(--sans);text-anchor:middle}.sub{fill:var(--soft);font:9px var(--mono);text-anchor:middle}.label{fill:var(--soft);font:9px var(--mono);text-anchor:middle}.lane-label{font:600 12px var(--sans)}
</style></head><body><main data-motion-root data-motion-mode="flow" data-flow-cycle="4.8" data-frame="static" data-static-frame="complete"><p class="eyebrow">Swimlane · Cross-functional handoff</p><h1>跨部门交付流程</h1><svg viewBox="0 0 1120 570" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="swimlane-flow-title swimlane-flow-desc"><title id="swimlane-flow-title">跨部门交付流程</title><desc id="swimlane-flow-desc">市场团队提出需求，销售确认范围，运营完成交付，再由销售回收客户反馈。</desc><defs><marker id="swimlane-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="1120" height="570" fill="#f5f5f5"/><rect class="lane" x="32" y="80" width="1056" height="112" rx="6"/><rect class="lane" x="32" y="192" width="1056" height="112" rx="6"/><rect class="lane" x="32" y="304" width="1056" height="112" rx="6"/><text class="lane-label" x="52" y="108">市场 Marketing</text><text class="lane-label" x="52" y="220">销售 Sales</text><text class="lane-label" x="52" y="332">运营 Operations</text>
<path class="edge" d="M320 136 V216 H420"/><path class="edge" d="M580 248 V328 H640"/><path class="edge" d="M800 360 V400 H884 V248 H900"/><rect class="step" x="160" y="112" width="160" height="48" rx="6"/><rect class="handoff" x="420" y="224" width="160" height="48" rx="6"/><rect class="step" x="640" y="336" width="160" height="48" rx="6"/><rect class="step" x="900" y="224" width="160" height="48" rx="6"/><text class="name" x="240" y="134">提出需求 Brief</text><text class="sub" x="240" y="152">campaign need</text><text class="name" x="500" y="246" fill="#eb6c36">确认范围 Scope</text><text class="sub" x="500" y="264">owner · SLA</text><text class="name" x="720" y="358">执行交付 Deliver</text><text class="sub" x="720" y="376">assets · launch</text><text class="name" x="980" y="246">回收反馈 Feedback</text><text class="sub" x="980" y="264">customer signal</text><text class="label" x="370" y="204">HANDOFF</text><text class="label" x="610" y="316">HANDOFF</text><text class="label" x="844" y="388">RETURN</text><line x1="60" y1="460" x2="1060" y2="460" stroke="#4f5d75" stroke-opacity=".14"/><text x="60" y="486" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="10" font-weight="600" letter-spacing="1.2">生成该图的指令 · PROMPT THAT MADE THIS</text><text x="60" y="510" fill="#4f5d75" font-family="'Noto Sans SC','Geist',sans-serif" font-size="12">中文：画三条泳道的跨部门流程，让市场、销售、运营之间的交接持续流动。</text><text x="60" y="534" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11">EN: Draw a three-lane cross-department process with continuous handoffs between marketing, sales, and operations.</text><g data-motion-decorative aria-hidden="true" focusable="false"><path class="flow-stream" d="M320 136 V216 H420"/><path class="flow-stream" style="--flow-delay:-1.1s" d="M580 248 V328 H640"/><path class="flow-stream" style="--flow-delay:-2.2s" d="M800 360 V400 H884 V248 H900"/><path class="flow-token" pathLength="1" d="M320 136 V216 H420"/><path class="flow-token" pathLength="1" style="--flow-delay:-1.1s" d="M580 248 V328 H640"/><path class="flow-token" pathLength="1" style="--flow-delay:-2.2s" d="M800 360 V400 H884 V248 H900"/></g></svg><p class="legend">Flow mode · 4.8s cycle · handoffs cross ownership boundaries while the three lanes stay stable.</p></main></body></html>
