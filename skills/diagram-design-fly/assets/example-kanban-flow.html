<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品看板</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"><style>

motion-decorative]{display:none!important}*{animation:none!important}}
</style></head><body><main data-motion-root data-motion-mode="flow" data-flow-cycle="3.2" data-flow-sequence="4"><p class="eyebrow">Kanban · Continuous flow</p><h1>产品交付看板 Product delivery board</h1><svg viewBox="0 0 1120 500" role="img" aria-labelledby="kanban-flow-title kanban-flow-desc"><title id="kanban-flow-title">产品交付看板 Product delivery board</title><desc id="kanban-flow-desc">待办、进行中、评审和完成四列看板，包含 WIP 限制和一张阻塞卡片 Four state columns with WIP limits and one blocked card.</desc><rect width="1120" height="500" style="fill:var(--p)"/><g><rect class="col" x="20" y="56" width="240" height="280"/><rect class="col" x="292" y="56" width="240" height="280"/><rect class="col" x="564" y="56" width="240" height="280"/><rect class="col" x="836" y="56" width="240" height="280"/></g><g class="head"><text x="36" y="84">待办 Todo</text><text x="308" y="84">进行中 Doing</text><text x="580" y="84">评审 Review</text><text x="852" y="84">完成 Done</text></g><g class="flow-seq" data-seq="1"><circle cx="236" cy="76" r="13"/><text x="236" y="76">1</text></g><g class="flow-seq" data-seq="2"><circle cx="508" cy="76" r="13"/><text x="508" y="76">2</text></g><g class="flow-seq" data-seq="3"><circle cx="780" cy="76" r="13"/><text x="780" y="76">3</text></g><g class="flow-seq" data-seq="4"><circle cx="1052" cy="76" r="13"/><text x="1052" y="76">4</text><g fill="none" stroke="var(--r)"><path d="M36 100H244M308 100H516M580 100H788M852 100H1060"/></g><g class="cardsub"><text x="214" y="84" text-anchor="end">3</text><text x="486" y="84" text-anchor="end">2/3</text><text x="758" y="84" text-anchor="end">1/3</text><text x="1030" y="84" text-anchor="end">2</text></g><g><rect class="card" x="36" y="120" width="208" height="56" rx="6"/><text class="cardtitle" x="48" y="145">价格页 Price page</text><text class="cardsub" x="48" y="163">AVA-214 · lina</text><rect class="card" x="36" y="188" width="208" height="56" rx="6"/><text class="cardtitle" x="48" y="213">新手引导 Onboarding</text><text class="cardsub" x="48" y="231">
