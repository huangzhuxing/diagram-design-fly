<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容增长飞轮</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --rule:rgba(45,49,66,.12); --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --serif:'Instrument Serif','Noto Sans SC',serif; --mono:'Geist Mono',ui-monospace,monospace; --flow-cycle:4.4s; --flow-ease:linear; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:40px 24px; color:var(--ink); background:var(--paper); font-family:var(--sans); }
    [data-motion-root] { width:min(100%,1100px); } .eyebrow { margin:0 0 8px; color:var(--muted); font:500 12px/1.4 var(--mono); letter-spacing:.18em; text-transform:uppercase; } h1 { margin:0 0 18px; font:400 34px/1.15 var(--serif); } svg { display:block; width:100%; min-width:900px; } .legend { margin:14px 0 0; padding-top:14px; border-top:1px solid var(--rule); color:var(--muted); font:500 12px/1.6 var(--mono); }
    .flow-stream { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:5 9; pointer-events:none; } [data-motion-mode="flow"] .flow-stream { animation: flow-stream var(--flow-cycle) var(--flow-ease) infinite; animation-delay:var(--flow-delay,0s); } @keyframes flow-stream { to { stroke-dashoffset:-70; } }
    .flow-token { fill:none; stroke:var(--accent); stroke-width:11; stroke-linecap:round; stroke-dasharray:0 var(--token-gap,1); stroke-dashoffset:var(--token-gap,1); pointer-events:none; } [data-motion-mode="flow"] .flow-token { animation: loop-flow-token var(--flow-cycle) var(--flow-ease) infinite; animation-delay:var(--flow-delay,0s); } @keyframes loop-flow-token { to { stroke-dashoffset:0; } } .flow-token-halo { stroke-width:20; opacity:.16; }
    .station { fill:var(--paper); stroke:var(--ink); stroke-width:1; } .station.focal { fill:rgba(235,108,54,.08); stroke:var(--accent); stroke-width:1.2; } .hub { fill:var(--ink); } .node-name { fill:var(--ink); font:600 12px var(--sans); text-anchor:middle; } .focal-name { fill:var(--accent); } .sublabel { fill:var(--soft); font:400 8px var(--mono); text-anchor:middle; } .hub-name { fill:var(--paper); font:600 16px var(--sans); text-anchor:middle; } .hub-sub { fill:var(--paper); opacity:.72; font:400 8px var(--mono); text-anchor:middle; } .arrow-label { fill:var(--soft); font:400 8px var(--mono); letter-spacing:.06em; text-anchor:middle; }
    /* Optional stage numbers — base layer, so they survive static capture. */
    .flow-seq circle { fill: #2d3142; stroke: #f5f5f5; stroke-width: 3; }
    .flow-seq text { fill: #f5f5f5; font: 600 12px/1 'Geist Mono', monospace; text-anchor: middle; dominant-baseline: middle; }
    html[data-motion="static"] [data-motion-decorative] { display:none !important; } html[data-motion="static"] * { animation:none !important; transition:none !important; } @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; } [data-motion-decorative] { display:none !important; } } @media print { body { padding:0; } [data-motion-decorative] { display:none !important; } * { animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="flow" data-flow-cycle="4.4" data-flow-sequence="5" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Loop / Flywheel · Continuous movement</p>

      <rect class="station" x="178.7" y="223.48" width="150" height="60" rx="6"/><text x="253.7" y="243.48" class="node-name">优化 Improve</text><text x="253.7" y="263.48" class="sublabel">learn · refine</text>
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/><text x="520" y="336" class="hub-name">共享反馈记录</text><text x="520" y="360" class="hub-sub">one record, every loop</text>
      <line x1="60" y1="654" x2="980" y2="654" stroke="#4f5d75" stroke-opacity=".14" stroke-width="1"/><text x="60" y="680" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="10" font-weight="600" letter-spacing="1.3">生成该图的指令 · PROMPT THAT MADE THIS</text><text x="60" y="706" fill="#4f5d75" font-family="'Geist','Noto Sans SC',sans-serif" font-size="12">中文：画一个内容 → 流量 → 反馈 → 内容的自增强飞轮，用 flow 模式让环路持续转动。</text><text x="60" y="730" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="11">EN: Draw a self-reinforcing content flywheel where traffic and feedback improve the next piece of content.</text>
