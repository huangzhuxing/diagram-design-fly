<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>审批决策流程 · Flow</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"><style>
*,*::before,*::after{box-sizing:border-box}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--rule:rgba(45,49,66,.12);--sans:'Geist','Noto Sans SC',sans-serif;--mono:'Geist Mono',monospace;--serif:'Instrument Serif','Noto Sans SC',serif;--flow-cycle:3.8s;--flow-ease:linear}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:36px 24px;background:var(--paper);color:var(--ink);font-family:var(--sans)}[data-motion-root]{width:min(100%,1000px)}.eyebrow{margin:0 0 8px;color:var(--muted);font:500 12px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 20px;font:400 34px/1.15 var(--serif)}svg{display:block;width:100%;min-width:820px}.legend{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font:500 12px/1.5 var(--mono)}.flow-stream{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 9;pointer-events:none}[data-motion-mode="flow"] .flow-stream{animation:flowchart-flow-stream var(--flow-cycle) var(--flow-ease) infinite;animation-delay:var(--flow-delay,0s)}@keyframes flowchart-flow-stream{to{stroke-dashoffset:-70}}.flow-token{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;stroke-dasharray:0 1;stroke-dashoffset:1;pointer-events:none}[data-motion-mode="flow"] .flow-token{animation:flowchart-flow-token var(--flow-cycle) var(--flow-ease) infinite;animation-delay:var(--flow-delay,0s)}@keyframes flowchart-flow-token{to{stroke-dashoffset:0}}html[data-motion="static"] [data-motion-decorative]{display:none!important}html[data-motion="static"] *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){[data-motion-decorative]{display:none!important}}@media print{[data-motion-decorative]{display:none!important}*{animation:none!important}}.edge{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#flowchart-flow-arrow)}.node{fill:var(--paper);stroke:var(--ink);stroke-width:1}.decision{fill:rgba(235,108,54,.08);stroke:var(--accent);stroke-width:1.2}.name{font:600 13px var(--sans);text-anchor:middle}.sub{fill:var(--soft);font:9px var(--mono);text-anchor:middle}.label{fill:var(--soft);font:9px var(--mono);text-anchor:middle}
</style></head><body><main data-motion-root data-motion-mode="flow" data-flow-cycle="3.8" data-frame="static" data-static-frame="complete"><p class="eyebrow">Flowchart · Decision path</p><h1>审批决策流程</h1><svg viewBox="0 0 980 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-flow-title flowchart-flow-desc"><title id="flowchart-flow-title">审批决策流程</title><desc id="flowchart-flow-desc">申请提交后经过资料校验，在审批判定处分成通过和补充资料两条路径。</desc><defs><marker id="flowchart-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="980" height="500" fill="#f5f5f5"/>
