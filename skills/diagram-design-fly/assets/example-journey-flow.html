<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户旅程图</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--p:#f5f5f5;--i:#2d3142;--m:#4f5d75;--s:#7a8399;--a:#eb6c36;--r:rgba(45,49,66,.12);--sans:'Geist','Noto Sans SC',sans-serif;--mono:'Geist Mono',monospace;--flow-cycle:3.8s}*{box-sizing:border-box}body{margin:0;padding:36px 24px;background:var(--p);color:var(--i);font-family:var(--sans)}main{max-width:1040px;margin:auto}.eyebrow{font:500 11px var(--mono);letter-spacing:.16em;color:var(--m)}h1{font:400 34px 'Instrument Serif','Noto Sans SC',serif;margin:8px 0 18px}svg{width:100%;display:block;overflow:visible}.grid{stroke:var(--r);stroke-width:1}.stage{fill:var(--i);font-size:13px;font-weight:600;text-anchor:middle}.small{font:9px var(--mono);fill:var(--m);text-anchor:middle}.curve{fill:none;stroke:var(--m);stroke-width:2}.trough{stroke:var(--a);stroke-width:2.5}.dot{fill:var(--p);stroke:var(--m);stroke-width:2}.troughdot{fill:var(--a);stroke:var(--a)}.pain{fill:rgba(235,108,54,.05);stroke:var(--a);stroke-dasharray:3 3}.flow-seq circle{fill:var(--i);stroke:var(--p);stroke-width:3}.flow-seq>text{fill:var(--p);font:600 11px var(--mono);text-anchor:middle;dominant-baseline:middle}.legend{border-top:1px solid var(--r);padding-top:14px;font:11px var(--mono);color:var(--m)}.flow-stream{fill:none;stroke:var(--a);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 9}.flow-token{fill:none;stroke:var(--a);stroke-width:10;stroke-linecap:round;stroke-dasharray:0 1;stroke-dashoffset:1}[data-motion-mode="flow"] .flow-stream{animation:journey-flow-stream var(--flow-cycle) linear infinite;animation-delay:var(--flow-delay,0s)}[data-motion-mode="flow"] .flow-token{animation:journey-flow-token var(--flow-cycle) linear infinite;animation-delay:var(--flow-delay,0s)}@keyframes journey-flow-stream{to{stroke-dashoffset:-70}}@keyframes journey-flow-token{to{stroke-dashoffset:0}}html[data-motion="static"] [data-motion-decorative]{display:none!important}html[data-motion="static"] *{animation:none!important}@media (prefers-reduced-motion:reduce){[data-motion-decorative]{display:none!important}*{animation:none!important}}@media print{[data-motion-decorative]{display:none!important}*{animation:none!important}}
</style></head><body><main data-motion-root data-motion-mode="flow" data-flow-cycle="3.8" data-flow-sequence="4"><p class="eyebrow">Journey · Continuous flow</p><h1>从认知到留存 From awareness to retention</h1><svg viewBox="0 0 1040 500" role="img" aria-labelledby="journey-flow-title journey-flow-desc"><title id="journey-flow-title">用户旅程图 User journey map</title><desc id="journey-flow-desc">用户经过认知、试用、购买、留存四阶段，情绪在试用阶段触底 A user moves through awareness, trial, purchase, and retention with a sentiment trough at trial.</desc><rect width="1040" height="500" style="fill:var(--p)"/><g class="stage"><text x="160" y="70">认知 Awareness</text><text x="380" y="70">试用 Trial</text><text x="600" y="70">购买 Purchase</text><text x="820" y="70">留存 Retention</text></g><g class="flow-seq" data-seq="1"><circle cx="160" cy="48" r="13"/><text x="160" y="48">1</text></g><g class="flow-seq" data-seq="2"><circle cx="380" cy="48" r="13"/><text x="380" y="48">2</text></g><g class="flow-seq" data-seq="3"><circle cx="600" cy="48" r="13"/><text x="600" y="48">3</text></g><g class="flow-seq" data-seq="4"><circle cx="820" cy="48" r="13"/><text x="820" y="48">4</text><g class="small"><text x="72" y="116" text-anchor="end">HIGH</text><text x="72" y="180" text-anchor="end">NEUTRAL</text><text x="72" y="244" text-anchor="end">LOW</text></g><g class="grid"><path d="M88 112H900M88 176H900M88 240H900"/></g><path class="curve" d="M160 128L380 224"/><path class="trough" d="M380 224L600 176"/><path class="curve" d="M600 176L820 128"/><g><circle class="dot" cx="160" cy="128" r="5"/><circle class="troughdot" cx="380" cy="224" r="5"/><circle class="dot" cx="600" cy="176" r="5"/><circle class="dot" cx="820" cy="128" r="5"/></g><g class="small"><text x="160" y="276">发现问题 Find need</text><text x="380" y="276">遇到摩擦 Friction</text><text x="600" y="276">获得价值 Value</text><text x="820" y="276">形成习惯 Habit</text></g><g><path d="M88 300H900" stroke="var(--r)"/><text x="88" y="326" font-family="var(--mono)" font-size="9" style="fill:var(--m)">ACTIONS</text><text x="160" y="326" class="stage">搜索 Search</text><text x="380" y="326" class="stage">创建 Create</text><text x="600" y="326" class="stage">付费 Pay</text><text x="820" y="326" class="stage">复用 Return</text><path d="M88 342H900" stroke="var(--r)"/><text x="88" y="368" font-family="var(--mono)" font-size="9" style="fill:var(--m)">TOUCHPOINTS</text><text x="160" y="368" class="small">短视频 Short video</text><text x="380" y="368" class="small">产品内 In-app</text><text x="600" y="368" class="small">结算页 Checkout</text><text x="820" y="368" class="small">提醒 Reminder</text></g><rect class="pain" x="310" y="390" width="140" height="24" rx="2"/><text x="380" y="406" text-anchor="middle" font-family="var(--mono)" font-size="9" style="fill:var(--a)">学习成本 Learning curve</text><line x1="64" y1="438" x2="976" y2="438" stroke="var(--r)"/><text x="64" y="462" style="fill:var(--a)" font-family="var(--mono)" font-size="10" font-weight="600">生成该图的指令 · PROMPT THAT MADE THIS</text><text x="64" y="484" style="fill:var(--m)" font-size="11">中文：画用户认知、试用、购买、留存四阶段，并加入情绪曲线。</text><g data-motion-decorative aria-hidden="true" focusable="false"><path class="flow-stream" d="M160 128L380 224"/><path class="flow-stream" style="--flow-delay:-.8s" d="M380 224L600 176"/><path class="flow-stream" style="--flow-delay:-1.6s" d="M600 176L820 128"/><path class="flow-token" pathLength="1" d="M160 128L380 224"/><path class="flow-token" pathLength="1" style="--flow-delay:-.8s" d="M380 224L600 176"/><path class="flow-token" pathLength="1" style="--flow-delay:-1.6s" d="M600 176L820 128"/></g></svg><p class="legend">Flow mode · 3.8s cycle · sentiment curve / 情绪曲线</p></main></body></html>
